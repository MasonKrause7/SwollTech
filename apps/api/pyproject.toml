[project]
name = "swolltech-api"
version = "0.1.0"
description = "SwollTech training notebook API"
requires-python = ">=3.12"
dependencies = [
  "asyncpg>=0.30.0",
  "boto3>=1.35.0",
  "fastapi>=0.115.0",
  "httpx>=0.28.0",
  "pydantic-settings>=2.6.0",
  "pyjwt>=2.10.0",
  "sentry-sdk[fastapi]>=2.19.0",
  "sqlalchemy[asyncio]>=2.0.36",
  "uvicorn[standard]>=0.32.0",
]

[dependency-groups]
dev = [
  "psycopg[binary]>=3.2.0",
  "pytest>=8.3.0",
  "pytest-cov>=5.0.0",
  "pytest-asyncio>=0.24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["swolltech"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
testpaths = ["tests"]
addopts = "-p no:cacheprovider"

[tool.coverage.run]
source = ["swolltech"]
concurrency = ["greenlet", "thread"]
omit = ["swolltech/storage.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.vercel]
entrypoint = "swolltech.main:app"
